services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ydv_erp
      POSTGRES_USER: ydv
      POSTGRES_PASSWORD: ydv_dev_only
    ports:
      - "55432:5432"
    volumes:
      - ydv_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ydv -d ydv_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ydv_erp_postgres_data:
